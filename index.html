<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#58784e">
  <title>梅姐蔬食｜線上訂購</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --green: #58784e;
      --green-dark: #3f5d38;
      --cream: #faf8f1;
      --text: #30382d;
      --muted: #777d72;
      --border: #e6e4da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans TC", sans-serif;
    }

    .header {
      padding: 30px 20px 26px;
      background: var(--green);
      color: white;
      text-align: center;
    }

    .brand {
      margin: 0;
      font-size: 27px;
      letter-spacing: 2px;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: min(100% - 28px, 560px);
      margin: 22px auto 36px;
    }

    .notice {
      padding: 14px 16px;
      border: 1px solid #e2e8d9;
      border-radius: 12px;
      background: #f0f4e9;
      color: var(--green-dark);
      font-size: 14px;
      line-height: 1.7;
    }

    .section-title {
      margin: 25px 0 13px;
      font-size: 19px;
    }

    .product {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 17px 15px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: white;
    }

    .product-info {
      min-width: 0;
    }

    .product-name {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .product-price {
      margin-top: 7px;
      color: var(--green);
      font-size: 15px;
      font-weight: 650;
    }

    .unit {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
    }

    .quantity {
      display: flex;
      flex-shrink: 0;
      align-items: center;
      gap: 12px;
    }

    .quantity button {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: white;
      color: var(--green-dark);
      font-size: 22px;
      cursor: pointer;
    }

    .quantity button:active {
      background: #edf2e8;
    }

    .quantity-value {
      min-width: 18px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
    }

    .summary {
      margin-top: 22px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: white;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 17px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .total-label {
      font-size: 16px;
      font-weight: 650;
    }

    .total-price {
      color: var(--green-dark);
      font-size: 25px;
      font-weight: 750;
    }

    .customer {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: white;
      border: 1px solid var(--border);
      font-size: 14px;
      line-height: 1.8;
    }

    .status {
      margin-top: 6px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .submit-button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
    }

    .submit-button:disabled {
      background: #a8b2a3;
      cursor: not-allowed;
    }

    .footer {
      margin: 22px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
    }
  </style>
</head>

<body>
  <header class="header">
    <h1 class="brand">梅姐蔬食</h1>
    <p class="subtitle">用心製作 · 新鮮蔬食 · 線上訂購</p>
  </header>

  <main class="container">
    <div class="notice">
      歡迎來到梅姐蔬食！<br>
      請選擇想購買的品項與數量，確認金額後即可準備送出訂單。
    </div>

    <h2 class="section-title">選購商品</h2>
    <div id="product-list"></div>

    <section class="summary">
      <h2 class="section-title" style="margin-top:0">訂單摘要</h2>
      <div id="order-summary">
        <div class="summary-row">
          <span>尚未選擇商品</span>
          <span>NT$0</span>
        </div>
      </div>

      <div class="total-row">
        <span class="total-label">訂單總額</span>
        <span class="total-price" id="total">NT$0</span>
      </div>
    </section>

    <section class="customer">
  <strong>LINE 客戶身分</strong>
  <div id="liff-status" class="status">
    正在初始化 LINE...
  </div>
</section>

<section class="customer">
  <strong>訂購人資料</strong>

  <div style="margin-top:12px">
    <label for="customer-name">姓名 *</label>
    <input
      id="customer-name"
      type="text"
      maxlength="50"
      autocomplete="name"
      placeholder="請輸入訂購人姓名"
      required
      style="display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #e6e4da;border-radius:8px;font-size:16px"
    >
  </div>

  <div style="margin-top:14px">
    <label for="customer-phone">聯絡電話 *</label>
    <input
      id="customer-phone"
      type="tel"
      maxlength="20"
      autocomplete="tel"
      placeholder="例如：0912345678"
      required
      style="display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #e6e4da;border-radius:8px;font-size:16px"
    >
  </div>

  <div style="margin-top:14px">
    <label for="pickup-info">取貨日期、時間或其他需求 *</label>
    <textarea
      id="pickup-info"
      maxlength="200"
      rows="1"
      placeholder="請先與梅姐溝通好品項及取貨時間，雙方有共識後再下訂單呦^^"
      required
      style="display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #e6e4da;border-radius:8px;font-size:16px;resize:vertical"
    ></textarea>
  </div>
</section>

<div id="order-status" class="status" role="status" aria-live="polite"></div>

    <button id="submit-button" class="submit-button" disabled>
  正在連線 LINE…
</button>

    <p class="footer">
      梅姐蔬食｜感謝您的支持<br>
    </p>
  </main>

  <script>
  const LIFF_ID = "2012058131-jaJTCBOA";
  const WORKER_URL =
    "https://meijie-line-bot.weichen0902.workers.dev/liff-order";

  const products = [
  { id: "tofu-sushi", name: "豆皮壽司", price: 120, unit: "份" },
  { id: "signature-sushi", name: "招牌壽司", price: 120, unit: "份" },
  { id: "assorted-sushi-rolls", name: "綜合壽司", price: 120, unit: "份" },
  { id: "vegetable-box", name: "元氣時蔬餐盒", price: 120, unit: "份" },
  { id: "tea-egg", name: "阿薩姆茶葉蛋", price: 50, unit: "份" },
  { id: "energy-drink", name: "能量穀漿", price: 80, unit: "杯" },
  { id: "pu-erh-milktea", name: "普洱奶茶", price: 80, unit: "杯" }
];

  const quantities = {};
  let liffReady = false;
  let submitting = false;

  products.forEach(product => {
    quantities[product.id] = 0;
  });

  const submitButton = document.getElementById("submit-button");
  const liffStatus = document.getElementById("liff-status");
  const orderStatus = document.getElementById("order-status");
    const pickupTextarea = document.getElementById("pickup-info");

  function adjustPickupTextarea() {
    const mirror = document.createElement("div");
    const style = getComputedStyle(pickupTextarea);

    mirror.style.position = "absolute";
    mirror.style.visibility = "hidden";
    mirror.style.width = pickupTextarea.clientWidth + "px";
    mirror.style.boxSizing = style.boxSizing;
    mirror.style.padding = style.padding;
    mirror.style.border = style.border;
    mirror.style.font = style.font;
    mirror.style.letterSpacing = style.letterSpacing;
    mirror.style.lineHeight = style.lineHeight;
    mirror.style.whiteSpace = "pre-wrap";
    mirror.style.overflowWrap = "break-word";
    mirror.style.wordBreak = "break-word";

    mirror.textContent =
      pickupTextarea.value || pickupTextarea.placeholder;

    document.body.appendChild(mirror);

    pickupTextarea.style.height = "auto";
    pickupTextarea.style.height =
      Math.max(mirror.scrollHeight, 40) + "px";

    mirror.remove();
  }

  pickupTextarea.addEventListener("input", adjustPickupTextarea);
  window.addEventListener("resize", adjustPickupTextarea);
  adjustPickupTextarea();

  function renderProducts() {
    const list = document.getElementById("product-list");

    list.innerHTML = products.map(product => `
      <article class="product">
        <div class="product-info">
          <h3 class="product-name">${product.name}</h3>
          <div class="product-price">
            NT$${product.price}
            <span class="unit">／${product.unit}</span>
          </div>
        </div>

        <div class="quantity">
          <button type="button"
            aria-label="減少${product.name}"
            data-action="minus"
            data-id="${product.id}">−</button>

          <span class="quantity-value" id="qty-${product.id}">0</span>

          <button type="button"
            aria-label="增加${product.name}"
            data-action="plus"
            data-id="${product.id}">+</button>
        </div>
      </article>
    `).join("");

    list.addEventListener("click", handleQuantityClick);
    renderSummary();
  }

  function handleQuantityClick(event) {
    const button = event.target.closest("button[data-action]");
    if (!button || submitting) return;

    const id = button.dataset.id;
    const action = button.dataset.action;

    if (action === "plus" && quantities[id] < 99) {
      quantities[id] += 1;
    } else if (action === "minus") {
      quantities[id] = Math.max(0, quantities[id] - 1);
    }

    document.getElementById("qty-" + id).textContent = quantities[id];
    renderSummary();
  }

  function getSelectedProducts() {
    return products
      .filter(product => quantities[product.id] > 0)
      .map(product => ({
        name: product.name,
        quantity: quantities[product.id]
      }));
  }

  function renderSummary() {
    const selected = products.filter(
      product => quantities[product.id] > 0
    );

    const total = selected.reduce(
      (sum, product) =>
        sum + product.price * quantities[product.id],
      0
    );

    const summary = document.getElementById("order-summary");

    if (selected.length === 0) {
      summary.innerHTML = `
        <div class="summary-row">
          <span>尚未選擇商品</span>
          <span>NT$0</span>
        </div>`;
    } else {
      summary.innerHTML = selected.map(product => `
        <div class="summary-row">
          <span>${product.name} × ${quantities[product.id]} ${product.unit}</span>
          <span>NT$${product.price * quantities[product.id]}</span>
        </div>
      `).join("");
    }

    document.getElementById("total").textContent = "NT$" + total;
  }

  async function initializeLiff() {
    try {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liffStatus.textContent = "請登入 LINE 以繼續。";
        liff.login();
        return;
      }

      const profile = await liff.getProfile();

      liffStatus.textContent = "已登入 LINE：" + profile.displayName;
      liffReady = true;
      submitButton.disabled = false;
      submitButton.textContent = "送出訂單";
    } catch (error) {
      console.error("LIFF 初始化失敗", error);
      liffStatus.textContent = "LINE 初始化失敗，請從 LINE 內重新開啟訂購頁。";
      submitButton.disabled = true;
    }
  }

  async function submitOrder() {
    if (submitting) return;

    orderStatus.textContent = "";

    if (!liffReady || !liff.isLoggedIn()) {
      orderStatus.textContent = "請先登入 LINE，再送出訂單。";
      return;
    }

    const customerName =
      document.getElementById("customer-name").value.trim();
    const customerPhone =
      document.getElementById("customer-phone").value.trim();
    const pickupInfo =
      document.getElementById("pickup-info").value.trim();
    const items = getSelectedProducts();

    if (!customerName || !customerPhone || !pickupInfo) {
      orderStatus.textContent = "請填寫姓名、聯絡電話及取貨資訊。";
      return;
    }

    if (!/^09\d{8}$/.test(customerPhone)) {
      orderStatus.textContent = "請輸入正確的台灣手機號碼，例如 0912345678。";
      return;
    }

    if (items.length === 0) {
      orderStatus.textContent = "請至少選擇一項商品。";
      return;
    }

    let idToken;
    try {
      idToken = liff.getIDToken();
    } catch (error) {
      console.error("取得 LINE ID Token 失敗", error);
    }

    if (!idToken) {
      orderStatus.textContent =
        "無法取得 LINE 身分驗證資料。請確認 LIFF 已開啟 openid 權限，然後重新登入。";
      return;
    }

    submitting = true;
    submitButton.disabled = true;
    submitButton.textContent = "訂單送出中…";

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          idToken,
          customerName,
          customerPhone,
          pickupInfo,
          items
        })
      });

      const result = await response.json().catch(() => ({}));

      if (!response.ok || result.ok !== true) {
        throw new Error(result.error || result.message ||
          `送出失敗（HTTP ${response.status}）`);
      }

      orderStatus.textContent =
        "訂單已送出！請留意 LINE 訊息，並確認取貨安排。";
      orderStatus.style.color = "#3f5d38";

      products.forEach(product => {
        quantities[product.id] = 0;
        document.getElementById("qty-" + product.id).textContent = "0";
      });
      renderSummary();

      document.getElementById("customer-name").value = "";
      document.getElementById("customer-phone").value = "";
      document.getElementById("pickup-info").value = "";
    } catch (error) {
      console.error("送出訂單失敗", error);
      orderStatus.textContent =
        "訂單送出失敗：" + error.message +
        "。請先確認 LINE 訂單群組是否已收到，避免重複下單。";
      orderStatus.style.color = "#b42318";
    } finally {
      submitting = false;
      submitButton.disabled = !liffReady;
      submitButton.textContent = "送出訂單";
    }
  }

  submitButton.addEventListener("click", submitOrder);

  renderProducts();
  initializeLiff();
</script>
</body>
</html>
